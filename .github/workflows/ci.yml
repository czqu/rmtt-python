name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        # aiokcp 0.0.4 vendors KCP C sources that trip GCC 14's default
        # -Werror=incompatible-pointer-types; demote that diagnostic so the
        # wheel builds (upstream has no prebuilt wheels).
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Self-signed certificate for TLS/QUIC tests
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rmtt-test-key.pem \
            -out /tmp/rmtt-test-cert.pem -days 1 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Unit and integration tests (tcp/tls/ws/kcp/quic)
        run: pytest -q

  e2e-python:
    name: e2e (python client x python server, all transports)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # aiokcp 0.0.4 vendors KCP C sources that trip GCC 14's default
        # -Werror=incompatible-pointer-types; demote that diagnostic so the
        # wheel builds (upstream has no prebuilt wheels).
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Self-signed certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rmtt-test-key.pem \
            -out /tmp/rmtt-test-cert.pem -days 1 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Cross-process python matrix
        run: |
          python e2e/matrix.py --out e2e/results/python --only "python,python,tcp;python,python,tls;python,python,ws;python,python,wss;python,python,kcp;python,python,quic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-python-results
          path: e2e/results/python

  e2e-cross-language:
    name: e2e (go/java/rust/cpp x python)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install rmtt-python
        env:
          CFLAGS: "-Wno-error=incompatible-pointer-types"
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Self-signed certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rmtt-test-key.pem \
            -out /tmp/rmtt-test-cert.pem -days 1 -nodes -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
      - name: Build the reference implementations
        run: ./e2e/setup_refs.sh
      - name: Cross-language echo matrix
        # netty's QUIC client requires the server to negotiate the "rmtt" ALPN;
        # the Go QUIC listener does not configure NextProtos, so this one
        # combination is a documented incompatibility between the reference
        # implementations (see e2e/results/REPORT.md section 8).
        run: |
          python e2e/matrix.py --out e2e/results \
            --markdown e2e/results/matrix.md \
            --expected "go,java,quic"
      - name: Raw-wire protocol conformance
        if: always()
        run: python e2e/protocol_suite.py --out e2e/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-cross-language-results
          path: e2e/results
